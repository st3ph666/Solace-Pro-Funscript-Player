name: Migrate Solace Pro Player v1.2.11

on:
  push:
    paths:
      - '.github/workflows/migrate-v1211.yml'
      - 'tools/migrate_v1211.py'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Tkinter for validation
        run: sudo apt-get update && sudo apt-get install -y python3-tk
      - name: Migrate source
        run: python3 tools/migrate_v1211.py
      - name: Compile modules
        run: python3 -m compileall -q src/solace_pro_player Solace-Pro-Funscript-Player-v1.2.11.py
      - name: Verify imports
        run: PYTHONPATH=src python3 -c 'import solace_pro_player.main'
      - name: Remove compile caches and migration helpers
        run: |
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          rm -f tools/migrate_v1211.py .github/workflows/migrate-v1211.yml
      - name: Commit migrated v1.2.11
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Refactor v1.2.11 into modules with uv deployment'
          git push
